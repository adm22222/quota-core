services:
  postgres:
    image: postgres:17
    container_name: quota-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quota_core
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quota_user -d quota_core']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://quota_user:${POSTGRES_PASSWORD}@postgres:5432/quota_core?schema=public
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QUOTA_API_URL: http://api:3000/api/v1
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      api:
        condition: service_started

  k6:
    image: grafana/k6:latest
    profiles: [perf]
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./perf:/scripts
    command: run /scripts/smoke.js

volumes:
  postgres_data:
