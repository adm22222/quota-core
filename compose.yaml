
services:
  postgres:
    image: postgres:17
    container_name: quota-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quota_core
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_user -d quota_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
